task: popqa
dataset_path: akariasai/PopQA
output_type: generate_until
test_split: test
doc_to_text: "{{question}}\nAnswer:"
doc_to_target: "{{obj}}"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
generation_kwargs:
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
num_fewshot: 0
metadata:
  version: 1.0
